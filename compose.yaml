services:
  postgres:
    image: postgres:latest
    container_name: postgres_container
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: barsikdb
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      postgres -c max_connections=1000
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres_user -d barsikdb" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
  app:
    build: ./backend/.
    container_name: backend
    ports: 
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/barsikdb
      SPRING_DATASOURCE_USERNAME: postgres_user
      SPRING_DATASOURCE_PASSWORD: 123
  web:
    build: ../Barsik-FE/.
    ports:
      - "3000:3000"
    depends_on:
      - app
    volumes:
     - .:/App
     - ./node_modules:/App/node_modules
    stdin_open: true
    tty: true
    command: npm start

volumes:
  pgdata: