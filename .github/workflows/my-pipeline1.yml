name: Java CI with Maven

on:
  push:
    branches: [ "dev" ]

jobs:
  CI-pipeline:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Test with Maven
      run: mvn test
      
    - name: Info type
      run: echo "all tests passed on commit${{ github.sha }} "
